kind = "web"
previewPath = "/static-epoxy-site/"
title = "Static Epoxy Site (SiteGround)"
version = "1.0.0"
id = "artifacts/static-epoxy-site"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/static-epoxy-site" ]
localPort = 20993

[services.development]
run = "pnpm --filter @workspace/static-epoxy-site run dev"

[services.production]
publicDir = "artifacts/static-epoxy-site/dist"
serve = "static"

[services.env]
PORT = "20993"
BASE_PATH = "/static-epoxy-site"
