        { "@type": "Question", "name": "How much does epoxy flooring cost in Elizabethtown, KY?",
          "acceptedAnswer": { "@type": "Answer", "text": "For a typical 2-car garage in the Elizabethtown area (about 400-500 sq ft), professional epoxy flooring runs roughly $4-$8 per square foot installed, or about $1,800-$3,500 total. Pricing depends on the system you choose, the condition of your concrete, decorative options, and prep work needed." } },

          "acceptedAnswer": { "@type": "Answer", "text": "A properly installed professional-grade epoxy or polyaspartic system lasts 15-20+ years in a residential garage with normal use. Commercial-grade systems hold up under heavy traffic and chemicals. The key is proper surface preparation — diamond grinding the concrete first, never just acid etching." } },
        { "@type": "Question", "name": "Epoxy vs. polyaspartic — which is better for my garage?",
          "acceptedAnswer": { "@type": "Answer", "text": "Both are excellent. Epoxy is the most cost-effective option and offers the widest range of decorative looks. Polyaspartic cures faster (same-day return to use), is more UV stable, and has slightly better flexibility. For most Elizabethtown homeowners we recommend a hybrid system — epoxy base coat with a polyaspartic top coat." } },
        { "@type": "Question", "name": "How long until I can park on my new garage floor?",
          "acceptedAnswer": { "@type": "Answer", "text": "With a polyaspartic system, you can walk on the floor in about 4-6 hours and park vehicles within 24 hours. Standard epoxy takes 24 hours for foot traffic and 3-5 days before parking heavy vehicles." } },
        { "@type": "Question", "name": "Do you serve Louisville, Hardin County, and the rest of Central & Western Kentucky?",
          "acceptedAnswer": { "@type": "Answer", "text": "Yes. We service Louisville and the entire Jefferson County metro, all of Hardin County (Elizabethtown, Radcliff, Vine Grove, Fort Knox, Cecilia, Sonora, Rineyville), Bullitt County (Shepherdsville, Mt Washington), Meade County (Brandenburg, Muldraugh), LaRue County (Hodgenville), Nelson County (Bardstown), and Grayson County (Leitchfield) — essentially all of Central and Western Kentucky. No extra trip charge anywhere in our service area." } },
        { "@type": "Question", "name": "Will epoxy stick to my old, stained, or cracked concrete?",
          "acceptedAnswer": { "@type": "Answer", "text": "In most cases yes. We diamond grind the surface to remove old sealers, oil stains, and weak top layers, then patch any cracks or pitting with structural concrete repair compound before coating." } },
        { "@type": "Question", "name": "Is epoxy flooring slippery when wet?",
          "acceptedAnswer": { "@type": "Answer", "text": "Standard epoxy can be slick when wet, but we add an aluminum oxide or silica anti-slip additive to the topcoat at no extra charge for traction similar to a textured concrete pool deck." } },
        { "@type": "Question", "name": "Can you apply epoxy in cold weather?",
          "acceptedAnswer": { "@type": "Answer", "text": "Yes — we work year-round in Kentucky. Modern polyaspartic and low-temperature epoxy formulations cure properly down to about 35°F. For unheated garages in winter we use temporary heaters." } },
