      "mainEntity": [
        { "@type": "Question", "name": "How much does epoxy flooring cost in Elizabethtown, KY?", "acceptedAnswer": { "@type": "Answer", "text": "For a typical 2-car garage in the Elizabethtown area (about 400-500 sq ft), professional epoxy flooring runs roughly $4-$8 per square foot installed, or about $1,800-$3,500 total. Pricing depends on the system you choose, the condition of your concrete, and decorative options. We provide free, transparent quotes with no pressure." } },
        { "@type": "Question", "name": "How long does epoxy flooring last?", "acceptedAnswer": { "@type": "Answer", "text": "A properly installed professional-grade epoxy or polyaspartic system lasts 15-20+ years in a residential garage with normal use. The key is proper surface preparation — diamond grinding the concrete first. That's why we never skip prep on any job." } },
        { "@type": "Question", "name": "Epoxy vs. polyaspartic — which is better for my garage?", "acceptedAnswer": { "@type": "Answer", "text": "Both are excellent. Epoxy is the most cost-effective and offers the widest range of decorative looks. Polyaspartic cures faster, is more UV stable, and has better flexibility. For most homeowners we recommend a hybrid system — epoxy base coat with a polyaspartic top coat — for the best of both." } },
        { "@type": "Question", "name": "How long until I can park on my new garage floor?", "acceptedAnswer": { "@type": "Answer", "text": "With a polyaspartic system, you can walk on the floor in about 4-6 hours and park vehicles within 24 hours. Standard epoxy takes 24 hours for foot traffic and 3-5 days before you should park heavy vehicles on it." } },
        { "@type": "Question", "name": "Do you serve Louisville, Hardin County, and Central & Western Kentucky?", "acceptedAnswer": { "@type": "Answer", "text": "Yes. We service Louisville and the entire Jefferson County metro, all of Hardin County (Elizabethtown, Radcliff, Vine Grove, Fort Knox), Bullitt County (Shepherdsville, Mt Washington), Meade County (Brandenburg), LaRue County (Hodgenville), Nelson County (Bardstown), and Grayson County (Leitchfield). No extra trip charge anywhere in our service area." } },
        { "@type": "Question", "name": "Will epoxy stick to my old, stained, or cracked concrete?", "acceptedAnswer": { "@type": "Answer", "text": "In most cases yes. We diamond grind the surface to remove old sealers, oil stains, and weak top layers, then patch any cracks or pitting before coating. Floors that look beyond saving usually clean up beautifully. We'll inspect your floor during the free estimate." } },
        { "@type": "Question", "name": "Is epoxy flooring slippery when wet?", "acceptedAnswer": { "@type": "Answer", "text": "Standard epoxy can be slick when wet, but we add an anti-slip additive to the topcoat at no extra charge. The result is traction similar to a textured concrete pool deck — safe when wet while still easy to clean." } },
        { "@type": "Question", "name": "Can you apply epoxy in cold weather?", "acceptedAnswer": { "@type": "Answer", "text": "Yes — we work year-round in Kentucky. Modern polyaspartic and low-temperature epoxy formulations cure properly down to about 35°F. For unheated garages in winter we use temporary heaters to maintain working temperature." } },
        { "@type": "Question", "name": "Do you offer a warranty on your epoxy floors?", "acceptedAnswer": { "@type": "Answer", "text": "Yes. All residential installations come with a written warranty covering adhesion failure, peeling, and bubbling. Commercial systems include extended warranty options. We'll go over the specifics during your free estimate." } },
